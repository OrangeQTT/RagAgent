# ============================================================
# 本地/服务器私密配置模板
#
# 用法：复制为 config/application.yml（通用密钥）
#       和/或 config/application-dev.yml、config/application-prod.yml（环境相关）
# config/ 目录下的 yml 已被 .gitignore 忽略，不会上传到 GitHub。
#
# Spring Boot 启动时会自动读取项目根目录（或 jar 同级）的 config/ 目录，
# 其优先级高于 classpath 里的 application*.yml，因此这里只需覆盖敏感项。
#
# 也可以不用本文件，改用同名环境变量：
#   MAIL_USERNAME / MAIL_PASSWORD / DASHSCOPE_API_KEY / BIGMODEL_API_KEY
#   REDIS_HOST / REDIS_PASSWORD / PGVECTOR_HOST / PGVECTOR_USER / PGVECTOR_PASSWORD
# ============================================================

spring:
  mail:
    username: your-mail@qq.com
    password: your-smtp-auth-code

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      streaming-chat-model:
        api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      embedding-model:
        api-key: sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

bigmodel:
  api-key: xxxxxxxx.xxxxxxxx
